name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[FR] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 需求描述 / Description
      description: 想解决什么问题，期望怎样实现
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本 / Plugin version
      placeholder: "1.4.6"
